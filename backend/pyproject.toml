[project]
name = "multi-coach-agent-backend"
version = "0.1.0"
description = "LangGraph multi-agent learning assistant backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "websockets>=13.0",
    "langgraph>=0.2.60",
    "langchain-core>=0.3.30",
    "langchain-openai>=0.2.14",
    "langchain-mcp-adapters>=0.1.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "python-dotenv>=1.0.1",
    "jieba>=0.42.1",
    "chromadb>=0.5.0",
    "FlagEmbedding>=1.2.10",
    "numpy>=1.26.0",
    "tiktoken>=0.7.0",
    "PyJWT>=2.9.0",
    "pypdf>=4.0.0",
    "pymupdf>=1.24.0",
    "pytesseract>=0.3.10",
    "Pillow>=10.0.0",
]

[project.optional-dependencies]
dev = ["ruff>=0.8.0"]

[build-system]
requires = ["setuptools>=75.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
